<!doctype html><meta charset="utf-8"><title>composer fixture</title>
<style>body{font:14px system-ui;padding:20px}
#box{border:1px solid #999;min-height:60px;padding:8px;margin:10px 0}
pre{background:#eee;padding:8px}</style>
<h3>Fake LinkedIn composer</h3>
<div id="box" class="msg-form__contenteditable" contenteditable="true" role="textbox"><p></p></div>
<pre id="out">ready</pre>
<script>
// Mirrors writeToComposer() from content.js
function writeToComposer(text, { replace }) {
  const el = document.querySelector('div[contenteditable="true"][role="textbox"]');
  el.focus();
  const sel = window.getSelection();
  if (replace) {
    const range = document.createRange();
    range.selectNodeContents(el);
    sel.removeAllRanges(); sel.addRange(range);
  } else if (!sel.rangeCount || !el.contains(sel.anchorNode)) {
    const end = document.createRange();
    end.selectNodeContents(el); end.collapse(false);
    sel.removeAllRanges(); sel.addRange(end);
  }
  const inserted = document.execCommand('insertText', false, text);
  if (!inserted) {
    if (replace) { el.textContent=''; const p=document.createElement('p'); p.textContent=text; el.appendChild(p); }
    else { (el.lastElementChild || el).append(document.createTextNode(text)); }
    el.dispatchEvent(new InputEvent('input',{bubbles:true,data:text,inputType:'insertText'}));
  }
  const end2 = document.createRange();
  end2.selectNodeContents(el); end2.collapse(false);
  sel.removeAllRanges(); sel.addRange(end2);
  return { inserted, text: el.textContent };
}
function insertMeetingLink(url) {
  const el = document.querySelector('div[contenteditable="true"][role="textbox"]');
  const existing = el.textContent;
  const prefix = existing.length && !/\s$/.test(existing) ? ' ' : '';
  return writeToComposer(prefix + url, { replace: false });
}
let events = 0;
document.getElementById('box').addEventListener('input', () => events++);
// Mirrors the dead-key suppression from content.js
const DEAD_KEY_CHARS = /^[\u02dc\u00a8\u00b4\u02c6\u0060\u00b5\u02da]$/;
let suppressInsertUntil = 0;
function claimKey(e){ e.preventDefault(); e.stopPropagation(); suppressInsertUntil = Date.now() + 250; }
function onStrayInsert(e){
  if (Date.now() > suppressInsertUntil) return;
  if (DEAD_KEY_CHARS.test(e.data || '')) { e.preventDefault(); e.stopPropagation(); }
}
document.addEventListener('beforeinput', onStrayInsert, true);

window.runDeadKeyTests = function () {
  const box = document.getElementById('box');
  const r = [];
  const fire = (data) => {
    const ev = new InputEvent('beforeinput', { data, inputType: 'insertText', bubbles: true, cancelable: true });
    box.dispatchEvent(ev);
    return ev.defaultPrevented;
  };
  // No hotkey claimed: ordinary typing must pass through untouched.
  suppressInsertUntil = 0;
  r.push({ case: 'plain text is never suppressed', prevented: fire('a') });
  r.push({ case: 'tilde with no hotkey passes through', prevented: fire('\u02dc') });
  // Hotkey just claimed: the dead-key character must be cancelled.
  claimKey(new KeyboardEvent('keydown', { cancelable: true }));
  r.push({ case: 'tilde right after a claimed hotkey', prevented: fire('\u02dc') });
  r.push({ case: 'umlaut right after a claimed hotkey', prevented: fire('\u00a8') });
  r.push({ case: 'real text still passes inside the window', prevented: fire('hello') });
  // Window expires.
  suppressInsertUntil = Date.now() - 1;
  r.push({ case: 'tilde after the window expires', prevented: fire('\u02dc') });
  document.getElementById('out').textContent = JSON.stringify(r, null, 2);
  return r;
};

window.runTests = function () {
  const URL = 'https://cal.com/example/intro';
  const box = document.getElementById('box');
  const results = [];
  // 1. link into an empty composer
  box.innerHTML = '<p></p>'; events = 0;
  insertMeetingLink(URL);
  results.push({ case: 'empty composer', text: box.textContent, events });
  // 2. draft first, then link appended
  box.innerHTML = '<p></p>'; events = 0;
  writeToComposer('Happy to chat, Alex.', { replace: true });
  insertMeetingLink(URL);
  results.push({ case: 'draft then link', text: box.textContent, events });
  // 3. draft already ends in a space
  box.innerHTML = '<p></p>'; events = 0;
  writeToComposer('Grab a slot: ', { replace: true });
  insertMeetingLink(URL);
  results.push({ case: 'trailing space', text: box.textContent, events });
  // 4. regenerate replaces, does not append
  box.innerHTML = '<p></p>'; events = 0;
  writeToComposer('First draft.', { replace: true });
  writeToComposer('Second draft.', { replace: true });
  results.push({ case: 'replace mode', text: box.textContent, events });
  document.getElementById('out').textContent = JSON.stringify(results, null, 2);
  return results;
};
</script>
