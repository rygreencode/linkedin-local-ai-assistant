<!doctype html><meta charset="utf-8"><title>unread filter fixture</title>
<style>body{font:14px system-ui;padding:20px}
button{font:inherit;padding:4px 12px;border-radius:14px;border:1px solid #999;background:#fff;cursor:pointer}
button[aria-pressed="true"]{background:#0a66c2;color:#fff}
pre{background:#eee;padding:10px;margin-top:14px}</style>
<div role="main" class="msg__container" style="max-width:640px;margin:80px auto 0;border:1px dashed #bbb;padding:16px">
<h3>Fake LinkedIn conversation filters</h3>
<div id="filters"></div>
<ul id="convos" style="list-style:none;padding:0;margin:14px 0;width:280px">
  <li class="msg-conversation-listitem"><a href="/in/alex-rivera/">avatar</a><a href="/messaging/thread/aaa/" class="msg-conversation-listitem__link">Alex Rivera</a></li>
  <li class="msg-conversation-listitem"><a href="/in/blair-chen/">avatar</a><a href="/messaging/thread/bbb/" class="msg-conversation-listitem__link">Blair Chen</a></li>
  <li class="msg-conversation-listitem"><a href="/in/casey-wu/">avatar</a><a href="/messaging/thread/ccc/" class="msg-conversation-listitem__link">Casey Wu</a></li>
</ul>
<div id="composer" class="msg-form__contenteditable" contenteditable="true" role="textbox"
     style="border:1px solid #999;min-height:40px;padding:6px;margin:10px 0;width:280px"></div>
<pre id="out">ready</pre>
</div>
<script>
// Mirrors the unread-filter logic from content.js
const LLA = { settings: { selectorOverrides: {} }, log(){}, resolve(key){
  const override = LLA.settings.selectorOverrides[key];
  const tiers = { unreadFilter: ['button[aria-label="Unread"]','[role="radio"][aria-label="Unread"]','button[aria-label^="Unread" i]'] }[key] || [];
  const list = override ? [override, ...tiers] : tiers;
  for (let i = 0; i < list.length; i++) {
    const el = document.querySelector(list[i]);
    if (el) return { el, selector: list[i], tier: override ? i - 1 : i };
  }
  return null;
}};
function isVisible(el){
  if (typeof el.checkVisibility === 'function') return el.checkVisibility();
  const r = el.getBoundingClientRect(); return r.width > 0 || r.height > 0;
}
function labelLooksUnread(el){
  const aria = (el.getAttribute('aria-label')||'').trim(), text = (el.textContent||'').trim();
  for (const label of [aria, text]) {
    if (!label || label.length > 40) continue;
    if (/^unread\b/i.test(label)) return true;
  }
  return false;
}
function unreadCandidates(root=document){
  return Array.from(root.querySelectorAll('button,[role="radio"],[role="menuitem"],[role="menuitemradio"],[role="tab"],[role="option"]'));
}
function findUnreadControl(){
  const hit = LLA.resolve('unreadFilter');
  if (hit && isVisible(hit.el) && labelLooksUnread(hit.el)) return hit.el;
  const visible = unreadCandidates().filter(el => isVisible(el) && labelLooksUnread(el));
  return visible.length ? visible[0] : null;
}
function findFilterMenuTrigger(){
  return unreadCandidates().find(el => {
    if (!isVisible(el)) return false;
    const label = ((el.getAttribute('aria-label')||'')+' '+(el.textContent||'')).toLowerCase();
    return /filter/.test(label) && !/\bsend\b/.test(label);
  }) || null;
}
function looksLikeSendControl(el){
  const label = ((el.getAttribute('aria-label')||'')+' '+(el.textContent||'')).toLowerCase();
  return /\bsend\b/.test(label);
}
function unreadFilterIsOn(el){
  if (el) {
    const p = el.getAttribute('aria-pressed') || el.getAttribute('aria-checked') || el.getAttribute('aria-selected');
    if (p !== null) return p === 'true';
    if (Array.from(el.classList).some(c => /selected|active/.test(c))) return true;
  }
  return /[?&]filter=unread/.test(location.search);
}
function withOpenFilterMenu(cb){
  const trigger = findFilterMenuTrigger();
  if (!trigger) return cb(null);
  trigger.click();
  const deadline = Date.now() + 900;
  const poll = () => {
    const el = findUnreadControl();
    if (el) return cb(el);
    if (Date.now() < deadline) return setTimeout(poll, 30);
    cb(null);
  };
  setTimeout(poll, 30);
}
function toggleUnreadFilter(cb){
  const el = findUnreadControl();
  const wasOn = unreadFilterIsOn(el);
  const click = (target, via) => {
    if (looksLikeSendControl(target)) return cb('refused: send control');
    target.click();
    cb(via);
  };
  if (el) return click(el, 'clicked directly');
  withOpenFilterMenu((fromMenu) => {
    if (fromMenu) return click(fromMenu, 'clicked via dropdown');
    cb('navigate:' + (wasOn ? '/messaging/' : '/messaging/?filter=unread'));
  });
}

const wait = (ms) => new Promise(r => setTimeout(r, ms));
const area = () => document.getElementById('filters');

window.runTests = async function () {
  const r = [];
  const set = (html) => { area().innerHTML = html; };

  // 1. plain visible pill
  set('<button id="u" aria-label="Unread" aria-pressed="false">Unread</button>');
  document.getElementById('u').onclick = function(){ this.setAttribute('aria-pressed','true'); };
  await new Promise(res => toggleUnreadFilter(a => { r.push({case:'visible pill', action:a, on:unreadFilterIsOn(findUnreadControl())}); res(); }));

  // 2. label carries a count
  set('<button aria-label="Unread (3)">Unread (3)</button>');
  r.push({ case:'label with a count', found: Boolean(findUnreadControl()) });

  // 3. "Mark as unread" must not be mistaken for the filter
  set('<button aria-label="Mark as unread">Mark as unread</button>');
  r.push({ case:'"Mark as unread" ignored', found: Boolean(findUnreadControl()) });

  // 4. hidden control, no dropdown -> URL fallback rather than a dead click
  set('<button aria-label="Unread" style="display:none">Unread</button>');
  await new Promise(res => toggleUnreadFilter(a => { r.push({case:'hidden control', action:a}); res(); }));

  // 5. behind a dropdown: item only exists once the menu opens
  set('<button id="trig" aria-label="Conversation filters">Filters</button><div id="menu"></div>');
  document.getElementById('trig').onclick = () => {
    setTimeout(() => { document.getElementById('menu').innerHTML =
      '<div role="menuitemradio" id="mi" aria-checked="false">Unread</div>'; }, 120);
  };
  await new Promise(res => toggleUnreadFilter(a => { r.push({case:'behind a dropdown', action:a}); res(); }));

  // 6. a filter row where Unread is NOT first — the reported "clicks Jobs" bug
  set('<div class="msg-conversations-container__filters">' +
      '<button role="radio" aria-label="Focused">Focused</button>' +
      '<button role="radio" aria-label="Unread" aria-checked="false">Unread</button>' +
      '<button role="radio" aria-label="Jobs">Jobs</button></div>');
  r.push({ case:'picks Unread, not a neighbouring pill',
           label: (findUnreadControl()||{}).getAttribute?.('aria-label') ?? null });

  // 7. a stale override pointing at the wrong pill must be ignored, not obeyed
  LLA.settings.selectorOverrides = { unreadFilter: 'button[aria-label="Jobs"]' };
  const viaOverride = findUnreadControl();
  r.push({ case:'stale override pointing at Jobs is refused',
           label: viaOverride ? viaOverride.getAttribute('aria-label') : null,
           notJobs: !viaOverride || viaOverride.getAttribute('aria-label') !== 'Jobs' });
  LLA.settings.selectorOverrides = {};

  // 8. send guard
  set('<button aria-label="Unread">Unread — Send message</button>');
  await new Promise(res => toggleUnreadFilter(a => { r.push({case:'send guard', action:a}); res(); }));

  document.getElementById('out').textContent = JSON.stringify(r, null, 2);
  return r;
};

// --- conversation navigation, mirroring content.js ---
LLA.resolveAll = function (key) {
  const tiers = { conversationItem: ['li.msg-conversation-listitem'] }[key] || [];
  for (const sel of tiers) { const n = document.querySelectorAll(sel); if (n.length) return { nodes: Array.from(n), selector: sel }; }
  return { nodes: [], selector: null };
};
let CURRENT_PATH = '/messaging/';          // stands in for location.pathname
let lastNavIndex = null;

const THREAD_LINK = 'a[href*="/messaging/thread/"]';
function conversationItems() {
  const visible = LLA.resolveAll('conversationItem').nodes.filter(el => isVisible(el));
  const withThread = visible.filter(el => el.querySelector(THREAD_LINK));
  return withThread.length ? withThread : visible;
}
function activeThreadId(pathname) {
  const m = (pathname || CURRENT_PATH).match(/\/messaging\/thread\/([^/?#]+)/);
  return m ? m[1] : null;
}
function rowThreadIds(el) {
  return Array.from(el.querySelectorAll('a[href*="/messaging/thread/"]'))
    .map(a => activeThreadId(a.getAttribute('href') || '')).filter(Boolean);
}
function isActiveConversation(el) {
  const openId = activeThreadId();
  if (openId) { const ids = rowThreadIds(el); if (ids.length) return ids.includes(openId); }
  if (el.getAttribute('aria-current')) return true;
  if (el.querySelector('[aria-current]')) return true;
  const classes = [el, el.firstElementChild].filter(Boolean)
    .map(n => (typeof n.className === 'string' ? n.className : '')).join(' ');
  return /is-selected|--active|\bactive\b/.test(classes);
}
function nextConversation() {
  const items = conversationItems();
  if (!items.length) return 'no rows';
  let current = items.findIndex(isActiveConversation);
  if (current === -1 && lastNavIndex !== null && lastNavIndex < items.length) current = lastNavIndex;
  const target = current === -1 ? items[0] : items[current + 1];
  if (!target) return 'at last';
  const clickable = target.querySelector(THREAD_LINK)
    || target.querySelector('.msg-conversation-listitem__link')
    || target.querySelector('[role="link"], button')
    || target;
  const label = ((clickable.getAttribute('aria-label')||'')+' '+(clickable.textContent||'')).toLowerCase();
  if (/\bsend\b/.test(label)) return 'refused: send control';
  lastNavIndex = current === -1 ? 0 : current + 1;
  return 'moved to ' + (clickable.getAttribute('href') || clickable.textContent.trim());
}
// Mirrors focusComposerAfterNavigation() from content.js
function focusComposerAfterNavigation(previousThreadId, timeoutMs, cb) {
  const started = Date.now();
  const focusIt = () => {
    const el = document.querySelector('div[contenteditable="true"][role="textbox"]');
    if (el && el.getBoundingClientRect().height > 0) {
      el.focus();
      const sel = window.getSelection(); const r = document.createRange();
      r.selectNodeContents(el); r.collapse(false);
      sel.removeAllRanges(); sel.addRange(r);
      return true;
    }
    return false;
  };
  const poll = () => {
    const arrived = activeThreadId() !== previousThreadId;
    if ((arrived && focusIt()) || Date.now() - started > timeoutMs) {
      if (!arrived) focusIt();
      cb({ arrived, focused: document.activeElement?.id === 'composer' || document.querySelector('#composer') === document.activeElement });
      return;
    }
    setTimeout(poll, 40);
  };
  setTimeout(poll, 40);
}

window.runFocusTest = function () {
  return new Promise((resolve) => {
    const out = [];
    document.body.focus();
    CURRENT_PATH = '/messaging/thread/bbb/';
    // The new thread lands 200ms after the click, as LinkedIn would render it.
    setTimeout(() => { CURRENT_PATH = '/messaging/thread/ccc/'; }, 200);
    focusComposerAfterNavigation('/messaging/thread/bbb/' && activeThreadId(), 2000, (r1) => {
      out.push({ case: 'thread changes, composer focused', ...r1 });
      // Now the thread never changes: it should still focus after the timeout.
      document.getElementById('composer').blur();
      const before = activeThreadId();
      focusComposerAfterNavigation(before, 400, (r2) => {
        out.push({ case: 'thread never changes, focuses on timeout', ...r2 });
        document.getElementById('out').textContent = JSON.stringify(out, null, 2);
        resolve(out);
      });
    });
  });
};

window.runNavTests = function () {
  const r = [];
  // The reported failure: rows whose first anchor is the avatar profile link.
  r.push({ case: 'clicks the thread link, not the avatar',
           target: (() => { CURRENT_PATH = '/messaging/thread/aaa/'; lastNavIndex = null;
                            return nextConversation(); })() });
  // A list of non-conversation rows must not be treated as conversations.
  const stray = document.createElement('ul');
  stray.innerHTML = '<li>not a conversation</li>';
  document.getElementById('convos').parentElement.appendChild(stray);
  r.push({ case: 'ignores rows with no thread link',
           usableRows: conversationItems().length });
  stray.remove();
  const reset = (path) => { CURRENT_PATH = path; lastNavIndex = null; };

  reset('/messaging/thread/bbb/');
  r.push({ case: 'URL says Blair (middle)', result: nextConversation() });
  reset('/messaging/thread/ccc/');
  r.push({ case: 'URL says Casey (last)', result: nextConversation() });
  reset('/messaging/thread/aaa/');
  r.push({ case: 'URL says Alex (first)', result: nextConversation() });

  // The reported bug: detection fails, so every press reopened the top row.
  reset('/messaging/');
  const a = nextConversation();
  const b = nextConversation();
  const c = nextConversation();
  r.push({ case: 'detection fails, 3 presses', result: [a, b, c] });

  document.getElementById('out').textContent = JSON.stringify(r, null, 2);
  return r;
};

</script>
